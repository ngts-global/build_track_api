apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildtrack-api
  labels:
    app: buildtrack-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: buildtrack-api
  template:
    metadata:
      labels:
        app: buildtrack-api
    spec:
      containers:
      - name: api
        image: buildtrack-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: buildtrack-secrets
              key: SUPABASE_URL
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: buildtrack-secrets
              key: SUPABASE_KEY
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
